name: Sync photo map

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes — GitHub's minimum, and it
                             # often runs late during busy periods. The real
                             # bottleneck is how often someone exports the
                             # CSV from the iPad, not this number.
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab, for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run map backend
        env:
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python -u map_backend_cloud.py
